name: Build aria2 static binaries

on:
  workflow_dispatch:
    inputs:
      aria2_version:
        description: aria2 release version to build
        required: true
        default: 1.37.0
  push:
    branches:
      - main
  pull_request:

env:
  ARIA2_VERSION: ${{ inputs.aria2_version || '1.37.0' }}
  OPENSSL_VERSION: 1.1.1w

jobs:
  linux64:
    name: linux64
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            autoconf \
            automake \
            build-base \
            c-ares-dev \
            c-ares-static \
            curl \
            expat-dev \
            expat-static \
            gettext-dev \
            libtool \
            linux-headers \
            perl \
            pkgconf \
            sqlite-dev \
            sqlite-static \
            tar \
            xz \
            zlib-dev \
            zlib-static

      - name: Build OpenSSL
        run: |
          curl -fsSL "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar -xf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure linux-x86_64 no-shared no-tests no-zlib --prefix="$PWD/../_openssl"
          make -j"$(nproc)"
          make install_sw

      - name: Download aria2
        run: |
          curl -fsSL "https://github.com/aria2/aria2/releases/download/release-${ARIA2_VERSION}/aria2-${ARIA2_VERSION}.tar.xz" -o aria2.tar.xz
          tar -xf aria2.tar.xz

      - name: Build
        working-directory: aria2-${{ env.ARIA2_VERSION }}
        run: |
          export PKG_CONFIG_PATH="$PWD/../_openssl/lib/pkgconfig"
          export CPPFLAGS="-I$PWD/../_openssl/include"
          ./configure \
            --prefix="$PWD/_install" \
            --disable-shared \
            --enable-static \
            --with-openssl \
            --without-gnutls \
            --without-libnettle \
            --without-libgmp \
            --without-libxml2 \
            --with-libcares \
            --with-libexpat \
            ARIA2_STATIC=yes \
            LDFLAGS="-static -L$PWD/../_openssl/lib"
          make -j"$(nproc)"
          make install
          mkdir -p ../dist
          cp _install/bin/aria2c ../dist/aria2c-linux64
          strip ../dist/aria2c-linux64

      - name: Test binary
        run: |
          ./dist/aria2c-linux64 --version
          if ldd ./dist/aria2c-linux64 2>&1 | grep -q "=>"; then
            ldd ./dist/aria2c-linux64
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2-${{ env.ARIA2_VERSION }}-linux64-static
          path: dist/aria2c-linux64
          if-no-files-found: error

  win64:
    name: win64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            curl
            perl
            tar
            xz
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-c-ares
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib

      - name: Build OpenSSL
        run: |
          curl -fsSL "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar -xf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure mingw64 no-shared no-tests no-zlib --prefix="$PWD/../_openssl"
          make -j"$(nproc)"
          make install_sw

      - name: Download aria2
        run: |
          curl -fsSL "https://github.com/aria2/aria2/releases/download/release-${ARIA2_VERSION}/aria2-${ARIA2_VERSION}.tar.xz" -o aria2.tar.xz
          tar -xf aria2.tar.xz

      - name: Build
        working-directory: aria2-${{ env.ARIA2_VERSION }}
        run: |
          export PKG_CONFIG_PATH="$PWD/../_openssl/lib/pkgconfig"
          export CPPFLAGS="-I$PWD/../_openssl/include"
          ./configure \
            --prefix="$PWD/_install" \
            --disable-shared \
            --enable-static \
            --with-openssl \
            --without-gnutls \
            --without-libnettle \
            --without-libgmp \
            --without-libxml2 \
            --with-libcares \
            --with-libexpat \
            ARIA2_STATIC=yes \
            LDFLAGS="-static -static-libgcc -static-libstdc++ -L$PWD/../_openssl/lib"
          make -j"$(nproc)"
          make install
          mkdir -p ../dist
          cp _install/bin/aria2c.exe ../dist/aria2c-win64.exe
          strip ../dist/aria2c-win64.exe

      - name: Test binary
        run: ./dist/aria2c-win64.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2-${{ env.ARIA2_VERSION }}-win64-static
          path: dist/aria2c-win64.exe
          if-no-files-found: error

  mac-arm:
    name: mac-arm
    runs-on: macos-14
    steps:
      - name: Install dependencies
        run: brew install autoconf automake libtool pkg-config c-ares sqlite expat

      - name: Build OpenSSL
        run: |
          curl -fsSL "https://github.com/openssl/openssl/releases/download/OpenSSL_1_1_1w/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar -xf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure darwin64-arm64-cc no-shared no-tests no-zlib --prefix="$PWD/../_openssl"
          make -j"$(sysctl -n hw.ncpu)"
          make install_sw

      - name: Download aria2
        run: |
          curl -fsSL "https://github.com/aria2/aria2/releases/download/release-${ARIA2_VERSION}/aria2-${ARIA2_VERSION}.tar.xz" -o aria2.tar.xz
          tar -xf aria2.tar.xz

      - name: Build
        working-directory: aria2-${{ env.ARIA2_VERSION }}
        run: |
          export PKG_CONFIG_PATH="$PWD/../_openssl/lib/pkgconfig:$(brew --prefix c-ares)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix expat)/lib/pkgconfig"
          export CPPFLAGS="-I$PWD/../_openssl/include -I$(brew --prefix c-ares)/include -I$(brew --prefix sqlite)/include -I$(brew --prefix expat)/include"
          export LDFLAGS="-L$PWD/../_openssl/lib -L$(brew --prefix c-ares)/lib -L$(brew --prefix sqlite)/lib -L$(brew --prefix expat)/lib"
          ./configure \
            --prefix="$PWD/_install" \
            --disable-shared \
            --enable-static \
            --with-openssl \
            --without-gnutls \
            --without-libnettle \
            --without-libgmp \
            --without-libxml2 \
            --with-libcares \
            --with-libexpat \
            ARIA2_STATIC=yes
          make -j"$(sysctl -n hw.ncpu)"
          make install
          mkdir -p ../dist
          cp _install/bin/aria2c ../dist/aria2c-mac-arm
          strip ../dist/aria2c-mac-arm

      - name: Test binary
        run: |
          ./dist/aria2c-mac-arm --version
          test "$(uname -m)" = "arm64"
          otool -L ./dist/aria2c-mac-arm
          if otool -L ./dist/aria2c-mac-arm | grep -E "(/opt/homebrew|/usr/local/Cellar)"; then
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria2-${{ env.ARIA2_VERSION }}-mac-arm-static-deps
          path: dist/aria2c-mac-arm
          if-no-files-found: error
