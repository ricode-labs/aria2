name: Build aria2 binaries

on:
  workflow_dispatch:
    inputs:
      aria2_version:
        description: aria2 release version to build
        required: true
        default: 1.37.0
  pull_request:

env:
  ARIA2_VERSION: ${{ inputs.aria2_version || '1.37.0' }}

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            gettext \
            libc-ares-dev \
            libcppunit-dev \
            libexpat1-dev \
            libsqlite3-dev \
            libssl-dev \
            pkg-config \
            xz-utils \
            zlib1g-dev

      - name: Download aria2
        run: |
          curl -fsSL "https://github.com/aria2/aria2/releases/download/release-${ARIA2_VERSION}/aria2-${ARIA2_VERSION}.tar.xz" -o aria2.tar.xz
          tar -xf aria2.tar.xz

      - name: Build
        working-directory: aria2-${{ env.ARIA2_VERSION }}
        run: |
          multiarch="$(gcc -print-multiarch)"
          export LIBCARES_LIBS="/usr/lib/$multiarch/libcares_static.a -lresolv -lpthread"
          export EXPAT_LIBS="/usr/lib/$multiarch/libexpat.a"
          export SQLITE3_LIBS="/usr/lib/$multiarch/libsqlite3.a -ldl -lm -lpthread /usr/lib/$multiarch/libz.a"
          export ZLIB_LIBS="/usr/lib/$multiarch/libz.a"
          ./configure \
            --prefix="$PWD/_install" \
            --with-openssl \
            --without-gnutls \
            --without-libnettle \
            --without-libgmp \
            --without-libxml2 \
            --without-libssh2 \
            --with-libcares \
            --with-libexpat \
            --with-sqlite3 \
            --with-libz \
            ARIA2_STATIC=no
          make -j"$(nproc)"
          make check || { cat test/test-suite.log; exit 1; }
          make install
          mkdir -p ../dist
          cp _install/bin/aria2c ../dist/aria2c-linux-x86_64
          strip ../dist/aria2c-linux-x86_64
          chmod 755 ../dist/aria2c-linux-x86_64
          tar -C ../dist -czf ../dist/aria2-linux-x86_64.tar.gz aria2c-linux-x86_64

      - name: Test binary
        run: |
          ./dist/aria2c-linux-x86_64 --version
          ldd_output="$(ldd ./dist/aria2c-linux-x86_64)"
          printf '%s\n' "$ldd_output"
          for library in libssl.so.3 libcrypto.so.3; do
            if ! printf '%s\n' "$ldd_output" | grep -Fq "$library"; then
              echo "Missing required dynamic dependency: $library"
              exit 1
            fi
          done
          if printf '%s\n' "$ldd_output" | grep -Eq 'libcares|libexpat|libsqlite3|libz\.so'; then
            exit 1
          fi
          ./dist/aria2c-linux-x86_64 --dry-run --max-tries=1 --timeout=30 \
            "https://github.com/aria2/aria2/releases/download/release-${ARIA2_VERSION}/aria2-${ARIA2_VERSION}.tar.xz"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2-linux-x86_64
          path: dist/aria2-linux-x86_64.tar.gz
          if-no-files-found: error

  linux-arm64:
    name: linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            ca-certificates \
            curl \
            gettext \
            libc-ares-dev \
            libcppunit-dev \
            libexpat1-dev \
            libsqlite3-dev \
            libssl-dev \
            pkg-config \
            xz-utils \
            zlib1g-dev

      - name: Download aria2
        run: |
          curl -fsSL "https://github.com/aria2/aria2/releases/download/release-${ARIA2_VERSION}/aria2-${ARIA2_VERSION}.tar.xz" -o aria2.tar.xz
          tar -xf aria2.tar.xz

      - name: Build
        working-directory: aria2-${{ env.ARIA2_VERSION }}
        run: |
          multiarch="$(gcc -print-multiarch)"
          export LIBCARES_LIBS="/usr/lib/$multiarch/libcares_static.a -lresolv -lpthread"
          export EXPAT_LIBS="/usr/lib/$multiarch/libexpat.a"
          export SQLITE3_LIBS="/usr/lib/$multiarch/libsqlite3.a -ldl -lm -lpthread /usr/lib/$multiarch/libz.a"
          export ZLIB_LIBS="/usr/lib/$multiarch/libz.a"
          ./configure \
            --prefix="$PWD/_install" \
            --with-openssl \
            --without-gnutls \
            --without-libnettle \
            --without-libgmp \
            --without-libxml2 \
            --without-libssh2 \
            --with-libcares \
            --with-libexpat \
            --with-sqlite3 \
            --with-libz \
            ARIA2_STATIC=no
          make -j"$(nproc)"
          make check || { cat test/test-suite.log; exit 1; }
          make install
          mkdir -p ../dist
          cp _install/bin/aria2c ../dist/aria2c-linux-arm64
          strip ../dist/aria2c-linux-arm64
          chmod 755 ../dist/aria2c-linux-arm64
          tar -C ../dist -czf ../dist/aria2-linux-arm64.tar.gz aria2c-linux-arm64

      - name: Test binary
        run: |
          ./dist/aria2c-linux-arm64 --version
          ldd_output="$(ldd ./dist/aria2c-linux-arm64)"
          printf '%s\n' "$ldd_output"
          for library in libssl.so.3 libcrypto.so.3; do
            if ! printf '%s\n' "$ldd_output" | grep -Fq "$library"; then
              echo "Missing required dynamic dependency: $library"
              exit 1
            fi
          done
          if printf '%s\n' "$ldd_output" | grep -Eq 'libcares|libexpat|libsqlite3|libz\.so'; then
            exit 1
          fi
          ./dist/aria2c-linux-arm64 --dry-run --max-tries=1 --timeout=30 \
            "https://github.com/aria2/aria2/releases/download/release-${ARIA2_VERSION}/aria2-${ARIA2_VERSION}.tar.xz"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2-linux-arm64
          path: dist/aria2-linux-arm64.tar.gz
          if-no-files-found: error

  windows-x86_64:
    name: windows-x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            curl
            tar
            xz
            zip
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-c-ares
            mingw-w64-ucrt-x86_64-cppunit
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib

      - name: Download aria2
        run: |
          curl -fsSL "https://github.com/aria2/aria2/releases/download/release-${ARIA2_VERSION}/aria2-${ARIA2_VERSION}.tar.xz" -o aria2.tar.xz
          tar -xf aria2.tar.xz

      - name: Build
        working-directory: aria2-${{ env.ARIA2_VERSION }}
        run: |
          ./configure \
            --prefix="$PWD/_install" \
            --disable-shared \
            --enable-static \
            --with-wintls \
            --without-openssl \
            --without-gnutls \
            --without-libnettle \
            --without-libgmp \
            --without-libxml2 \
            --without-libssh2 \
            --with-libcares \
            --with-libexpat \
            --with-sqlite3 \
            --with-libz \
            ARIA2_STATIC=yes \
            LDFLAGS="-static -static-libgcc -static-libstdc++"
          make -j"$(nproc)"
          make check || { cat test/test-suite.log; exit 1; }
          make install
          mkdir -p ../dist
          cp _install/bin/aria2c.exe ../dist/aria2c-windows-x86_64.exe
          strip ../dist/aria2c-windows-x86_64.exe
          zip -j ../dist/aria2-windows-x86_64.zip ../dist/aria2c-windows-x86_64.exe

      - name: Test binary
        run: ./dist/aria2c-windows-x86_64.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2-windows-x86_64
          path: dist/aria2-windows-x86_64.zip
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64
    runs-on: macos-14
    steps:
      - name: Install dependencies
        run: brew install autoconf automake cppunit libtool pkg-config c-ares sqlite expat

      - name: Download aria2
        run: |
          curl -fsSL "https://github.com/aria2/aria2/releases/download/release-${ARIA2_VERSION}/aria2-${ARIA2_VERSION}.tar.xz" -o aria2.tar.xz
          tar -xf aria2.tar.xz

      - name: Build
        working-directory: aria2-${{ env.ARIA2_VERSION }}
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix c-ares)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix expat)/lib/pkgconfig"
          export CPPFLAGS="-I$(brew --prefix c-ares)/include -I$(brew --prefix sqlite)/include -I$(brew --prefix expat)/include"
          export LDFLAGS="-L$(brew --prefix c-ares)/lib -L$(brew --prefix sqlite)/lib -L$(brew --prefix expat)/lib"
          export EXPAT_CFLAGS="-I$(brew --prefix expat)/include -DXML_STATIC"
          export EXPAT_LIBS="$(brew --prefix expat)/lib/libexpat.a"
          export LIBCARES_CFLAGS="-I$(brew --prefix c-ares)/include -DCARES_STATICLIB"
          export LIBCARES_LIBS="$(brew --prefix c-ares)/lib/libcares.a -lresolv"
          export SQLITE3_CFLAGS="-I$(brew --prefix sqlite)/include"
          export SQLITE3_LIBS="$(brew --prefix sqlite)/lib/libsqlite3.a -lz"
          ./configure \
            --prefix="$PWD/_install" \
            --disable-shared \
            --enable-static \
            --with-appletls \
            --without-openssl \
            --without-gnutls \
            --without-libnettle \
            --without-libgmp \
            --without-libxml2 \
            --without-libssh2 \
            --with-libcares \
            --with-libexpat \
            --with-sqlite3 \
            --with-libz \
            ARIA2_STATIC=yes
          make -j"$(sysctl -n hw.ncpu)"
          make check || { cat test/test-suite.log; exit 1; }
          make install
          mkdir -p ../dist
          cp _install/bin/aria2c ../dist/aria2c-macos-arm64
          strip ../dist/aria2c-macos-arm64
          chmod 755 ../dist/aria2c-macos-arm64
          tar -C ../dist -czf ../dist/aria2-macos-arm64.tar.gz aria2c-macos-arm64

      - name: Test binary
        run: |
          ./dist/aria2c-macos-arm64 --version
          test "$(uname -m)" = "arm64"
          otool -L ./dist/aria2c-macos-arm64
          if otool -L ./dist/aria2c-macos-arm64 | grep -E "(/opt/homebrew|/usr/local/Cellar)"; then
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2-macos-arm64
          path: dist/aria2-macos-arm64.tar.gz
          if-no-files-found: error

  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - linux-x86_64
      - linux-arm64
      - windows-x86_64
      - macos-arm64
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: aria2-*
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="aria2-${ARIA2_VERSION}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --repo "$GITHUB_REPOSITORY"
          fi

          gh release create "$tag" release/* \
            --target "$GITHUB_SHA" \
            --title "aria2 ${ARIA2_VERSION} binaries" \
            --notes "aria2 binaries for linux-x86_64, linux-arm64, windows-x86_64, and macos-arm64. Linux and macOS binaries are packaged as tar.gz archives to preserve executable permissions." \
            --latest \
            --repo "$GITHUB_REPOSITORY"
