name: Build aria2 static binaries

on:
  workflow_dispatch:
    inputs:
      aria2_version:
        description: aria2 release version to build
        required: true
        default: 1.37.0
  push:
    branches:
      - main
  pull_request:

env:
  ARIA2_VERSION: ${{ inputs.aria2_version || '1.37.0' }}
  OPENSSL_VERSION: 3.6.3

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: linux-x86_64
    runs-on: ubuntu-latest
    container: alpine:3.24
    steps:
      - name: Install dependencies
        run: |
          apk add --no-cache \
            autoconf \
            automake \
            build-base \
            c-ares-dev \
            cppunit-dev \
            curl \
            expat-dev \
            expat-static \
            file \
            gettext-dev \
            libtool \
            linux-headers \
            perl \
            pkgconf \
            sqlite-dev \
            sqlite-static \
            tar \
            xz \
            zlib-dev \
            zlib-static

      - name: Build OpenSSL
        run: |
          curl -fsSL "https://github.com/openssl/openssl/releases/download/openssl-${OPENSSL_VERSION}/openssl-${OPENSSL_VERSION}.tar.gz" -o openssl.tar.gz
          tar -xf openssl.tar.gz
          cd "openssl-${OPENSSL_VERSION}"
          ./Configure linux-x86_64 no-shared no-module no-dso no-tests no-zlib --prefix="$PWD/../_openssl"
          make -j"$(nproc)"
          make install_sw

      - name: Download aria2
        run: |
          curl -fsSL "https://github.com/aria2/aria2/releases/download/release-${ARIA2_VERSION}/aria2-${ARIA2_VERSION}.tar.xz" -o aria2.tar.xz
          tar -xf aria2.tar.xz

      - name: Build
        working-directory: aria2-${{ env.ARIA2_VERSION }}
        run: |
          export PKG_CONFIG_PATH="$PWD/../_openssl/lib/pkgconfig:$PWD/../_openssl/lib64/pkgconfig"
          export CPPFLAGS="-I$PWD/../_openssl/include"
          ./configure \
            --prefix="$PWD/_install" \
            --disable-shared \
            --enable-static \
            --with-openssl \
            --without-gnutls \
            --without-libnettle \
            --without-libgmp \
            --without-libxml2 \
            --without-libssh2 \
            --with-libcares \
            --with-libexpat \
            --with-sqlite3 \
            --with-libz \
            ARIA2_STATIC=yes \
            LDFLAGS="-static -L$PWD/../_openssl/lib -L$PWD/../_openssl/lib64"
          make -j"$(nproc)"
          make check
          make install
          mkdir -p ../dist
          cp _install/bin/aria2c ../dist/aria2c-linux-x86_64
          strip ../dist/aria2c-linux-x86_64
          chmod 755 ../dist/aria2c-linux-x86_64
          tar -C ../dist -czf ../dist/aria2-${ARIA2_VERSION}-linux-x86_64-static.tar.gz aria2c-linux-x86_64

      - name: Test binary
        run: |
          ./dist/aria2c-linux-x86_64 --version
          if ldd ./dist/aria2c-linux-x86_64 2>&1 | grep -q "=>"; then
            ldd ./dist/aria2c-linux-x86_64
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2-${{ env.ARIA2_VERSION }}-linux-x86_64-static
          path: dist/aria2-${{ env.ARIA2_VERSION }}-linux-x86_64-static.tar.gz
          if-no-files-found: error

  windows-x86_64:
    name: windows-x86_64
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            curl
            tar
            xz
            zip
            mingw-w64-ucrt-x86_64-autotools
            mingw-w64-ucrt-x86_64-c-ares
            mingw-w64-ucrt-x86_64-cppunit
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib

      - name: Download aria2
        run: |
          curl -fsSL "https://github.com/aria2/aria2/releases/download/release-${ARIA2_VERSION}/aria2-${ARIA2_VERSION}.tar.xz" -o aria2.tar.xz
          tar -xf aria2.tar.xz

      - name: Build
        working-directory: aria2-${{ env.ARIA2_VERSION }}
        run: |
          ./configure \
            --prefix="$PWD/_install" \
            --disable-shared \
            --enable-static \
            --with-wintls \
            --without-openssl \
            --without-gnutls \
            --without-libnettle \
            --without-libgmp \
            --without-libxml2 \
            --without-libssh2 \
            --with-libcares \
            --with-libexpat \
            --with-sqlite3 \
            --with-libz \
            ARIA2_STATIC=yes \
            LDFLAGS="-static -static-libgcc -static-libstdc++"
          make -j"$(nproc)"
          make check
          make install
          mkdir -p ../dist
          cp _install/bin/aria2c.exe ../dist/aria2c-windows-x86_64.exe
          strip ../dist/aria2c-windows-x86_64.exe
          zip -j ../dist/aria2-${ARIA2_VERSION}-windows-x86_64-static.zip ../dist/aria2c-windows-x86_64.exe

      - name: Test binary
        run: ./dist/aria2c-windows-x86_64.exe --version

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2-${{ env.ARIA2_VERSION }}-windows-x86_64-static
          path: dist/aria2-${{ env.ARIA2_VERSION }}-windows-x86_64-static.zip
          if-no-files-found: error

  macos-arm64:
    name: macos-arm64
    runs-on: macos-15
    steps:
      - name: Install dependencies
        run: brew install autoconf automake cppunit libtool pkg-config c-ares sqlite expat

      - name: Download aria2
        run: |
          curl -fsSL "https://github.com/aria2/aria2/releases/download/release-${ARIA2_VERSION}/aria2-${ARIA2_VERSION}.tar.xz" -o aria2.tar.xz
          tar -xf aria2.tar.xz

      - name: Build
        working-directory: aria2-${{ env.ARIA2_VERSION }}
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix c-ares)/lib/pkgconfig:$(brew --prefix sqlite)/lib/pkgconfig:$(brew --prefix expat)/lib/pkgconfig"
          export CPPFLAGS="-I$(brew --prefix c-ares)/include -I$(brew --prefix sqlite)/include -I$(brew --prefix expat)/include"
          export LDFLAGS="-L$(brew --prefix c-ares)/lib -L$(brew --prefix sqlite)/lib -L$(brew --prefix expat)/lib"
          export EXPAT_CFLAGS="-I$(brew --prefix expat)/include -DXML_STATIC"
          export EXPAT_LIBS="$(brew --prefix expat)/lib/libexpat.a"
          export LIBCARES_CFLAGS="-I$(brew --prefix c-ares)/include -DCARES_STATICLIB"
          export LIBCARES_LIBS="$(brew --prefix c-ares)/lib/libcares.a -lresolv"
          export SQLITE3_CFLAGS="-I$(brew --prefix sqlite)/include"
          export SQLITE3_LIBS="$(brew --prefix sqlite)/lib/libsqlite3.a -lz"
          ./configure \
            --prefix="$PWD/_install" \
            --disable-shared \
            --enable-static \
            --with-appletls \
            --without-openssl \
            --without-gnutls \
            --without-libnettle \
            --without-libgmp \
            --without-libxml2 \
            --without-libssh2 \
            --with-libcares \
            --with-libexpat \
            --with-sqlite3 \
            --with-libz \
            ARIA2_STATIC=yes
          make -j"$(sysctl -n hw.ncpu)"
          make check
          make install
          mkdir -p ../dist
          cp _install/bin/aria2c ../dist/aria2c-macos-arm64
          strip ../dist/aria2c-macos-arm64
          chmod 755 ../dist/aria2c-macos-arm64
          tar -C ../dist -czf ../dist/aria2-${ARIA2_VERSION}-macos-arm64-static.tar.gz aria2c-macos-arm64

      - name: Test binary
        run: |
          ./dist/aria2c-macos-arm64 --version
          test "$(uname -m)" = "arm64"
          otool -L ./dist/aria2c-macos-arm64
          if otool -L ./dist/aria2c-macos-arm64 | grep -E "(/opt/homebrew|/usr/local/Cellar)"; then
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2-${{ env.ARIA2_VERSION }}-macos-arm64-static
          path: dist/aria2-${{ env.ARIA2_VERSION }}-macos-arm64-static.tar.gz
          if-no-files-found: error

  release:
    name: release
    runs-on: ubuntu-latest
    needs:
      - linux-x86_64
      - windows-x86_64
      - macos-arm64
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: aria2-${{ env.ARIA2_VERSION }}-*-static
          path: release
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="aria2-${ARIA2_VERSION}"
          title="aria2 ${ARIA2_VERSION} static binaries"
          notes="Static aria2 binaries for linux-x86_64, windows-x86_64, and macos-arm64. Linux and macOS binaries are packaged as tar.gz archives to preserve executable permissions."

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete-asset "$tag" aria2c-linux-x86_64 --yes --repo "$GITHUB_REPOSITORY" || true
            gh release delete-asset "$tag" aria2c-macos-arm64 --yes --repo "$GITHUB_REPOSITORY" || true
            gh release delete-asset "$tag" aria2c-windows-x86_64.exe --yes --repo "$GITHUB_REPOSITORY" || true
            gh release upload "$tag" release/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release/* \
              --target "$GITHUB_SHA" \
              --title "$title" \
              --notes "$notes" \
              --repo "$GITHUB_REPOSITORY"
          fi
